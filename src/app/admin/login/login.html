<div class="login">
  <a class="admin-back" routerLink="/">
    <svg lucideArrowLeft aria-hidden="true"></svg>
    Tillbaka till hemsidan
  </a>

  <div class="panel">
    <p class="admin-eyebrow">Admin</p>
    <h1 class="admin-title">Logga in</h1>

    <form class="admin-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label for="email">E-post</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />

      <label for="password">Lösenord</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />

      @if (error()) {
        <p class="admin-error" role="alert">{{ error() }}</p>
      }

      <button class="admin-button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Loggar in…' : 'Logga in' }}
      </button>
    </form>
  </div>
</div>

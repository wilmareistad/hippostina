<header class="header" #header>
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-name">HIPPOSTINA</span>
    <span class="brand-tagline">KONST AV STINA</span>
  </a>

  <button
    class="menu-button"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-nav"
    [attr.aria-label]="menuOpen() ? 'Stäng menyn' : 'Öppna menyn'"
    (click)="toggleMenu()"
  >
    @if (menuOpen()) {
      <svg lucideX aria-hidden="true"></svg>
    } @else {
      <svg lucideMenu aria-hidden="true"></svg>
    }
  </button>

  <nav id="main-nav" class="nav" [class.open]="menuOpen()" aria-label="Huvudmeny">
    <!-- exact: true, otherwise "/" would count as active on every page. -->
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      >Hem</a
    >
    <a routerLink="/malningar" routerLinkActive="active" (click)="closeMenu()">Målningar</a>
    <!-- The contact section is on the start page. No routerLinkActive: it ignores the fragment,
         so "Kontakt" would be marked as active on the whole start page. -->
    <a routerLink="/" fragment="kontakt" (click)="closeMenu()">Kontakt</a>
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-top">
      <div>
        <p class="footer-eyebrow">ATELJÉ &amp; ORIGINALKONST</p>
        <p class="footer-brand">Hippostina</p>
        <p class="footer-tagline">Konst av Stina • Sverige</p>
      </div>

      <a
        class="footer-button"
        [href]="contact.instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg lucideCamera aria-hidden="true"></svg>
        {{ contact.instagram }}
      </a>
    </div>

    <div class="footer-bottom">
      <nav class="footer-nav" aria-label="Sidfot">
        <a routerLink="/">Hem</a>
        <a routerLink="/malningar">Målningar</a>
        <a routerLink="/integritetspolicy">Integritetspolicy</a>
        <a routerLink="/kopvillkor">Köpvillkor och ångerrätt</a>
        <a routerLink="/admin/logga-in">Admin</a>
      </nav>
      <p class="footer-copyright">© {{ year }} Hippostina</p>
    </div>
  </div>
</footer>
